<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>I Love You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --ink:#f4f1ec;
  --dim:rgba(244,241,236,.55);
  --faint:rgba(244,241,236,.3);
  --line:rgba(244,241,236,.09);
  --rose:#ff6f98;
  --rose-soft:#ffc2d3;
  --caret:#ff5f7e;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:var(--mono)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bloom{filter:blur(6px);mix-blend-mode:screen;opacity:.8;pointer-events:none}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.72) 100%)}

.stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;pointer-events:none;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}

/* ---------- title ---------- */
.top{flex:none;text-align:center;padding-top:clamp(18px,4.5vh,56px)}
.titles{display:grid;justify-items:center}
.titles > *{grid-area:1/1}
.title{margin:0;font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:clamp(48px,min(13vw,11vh),104px);line-height:1.05;letter-spacing:.01em;white-space:nowrap;
  text-shadow:0 0 18px rgba(255,255,255,.35),0 0 50px rgba(255,111,152,.3);
  transition:opacity 1s ease,filter 1s ease,text-shadow 2s ease}
#title span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(.25em);
  transition:opacity 1s ease,filter 1.1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1);
  transition-delay:calc(var(--i) * 85ms)}
.top.show #title span{opacity:1;filter:blur(0);transform:none}
.top.said .title{text-shadow:0 0 18px rgba(255,190,210,.55),0 0 70px rgba(255,90,140,.55)}
#final{font-size:clamp(40px,min(10.5vw,9vh),92px);opacity:0;filter:blur(12px);transform:translateY(.2em);
  transition:opacity 1.6s ease,filter 1.6s ease,transform 1.6s cubic-bezier(.2,.8,.2,1)}
.top.ended #title{opacity:0;filter:blur(12px)}
.top.ended #final{opacity:1;filter:none;transform:none}
.date{margin:10px 0 0;font-size:11px;letter-spacing:.42em;color:var(--dim);opacity:0;transition:opacity 1.6s .7s}
.top.ended .date{opacity:1}

/* ---------- ring area + hud ---------- */
.ring-area{flex:1 1 auto;position:relative;min-height:120px}
.frame{position:absolute;inset:0;margin:0 auto;width:min(760px,100%)}
.hud{position:absolute;font-size:10px;line-height:1.6;color:var(--faint);letter-spacing:.02em;
  opacity:0;transition:opacity 1.2s}
.hud.on{opacity:1}
.hud-tr{top:6px;right:2px;display:flex;align-items:center;gap:6px}
.hud-tr i{width:5px;height:5px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e;
  animation:blink 1.4s steps(1) infinite}
.hud-bl{left:2px;bottom:6px}

/* ---------- terminal dock ---------- */
.dock{flex:none;width:min(760px,100%);margin:0 auto;padding-bottom:10px;pointer-events:auto}
.bar{display:flex;justify-content:space-between;gap:12px;font-size:10.5px;color:var(--dim);
  padding:6px 10px;background:rgba(255,255,255,.035);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bar span:last-child{color:var(--faint)}
.panel{position:relative;height:clamp(200px,28vh,270px);overflow:hidden}

.code{position:absolute;inset:8px 0 0;margin:0;font:400 11px/1.65 var(--mono);color:#8a92a2;
  white-space:pre;transition:opacity .9s,filter .9s}
.code .ln{display:block;min-height:1.65em;padding-left:46px;position:relative}
.code .ln::before{content:attr(data-n);position:absolute;left:0;width:30px;text-align:right;color:#3c4250}
.code .cur{background:rgba(255,255,255,.045)}
.code .cur::after{content:"";position:absolute;left:37px;top:3px;bottom:3px;width:2px;background:var(--caret)}
.code i{font-style:normal}
.code .c{color:#596070;font-style:italic}
.code .s{color:#9ad1a0}
.code .k{color:#ff7aa8}
.code .f{color:#7fb8ff}
.code .n{color:#ffb36b}
.code .K{color:#d6b4ff}
.panel.dim .code{opacity:.15;filter:blur(.6px)}
.panel.after .code{opacity:0}

.caret{display:inline-block;width:.6em;height:1.1em;vertical-align:-.18em;margin-left:1px;
  background:var(--caret);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.out{position:absolute;inset:16px 6px 60px;font:400 clamp(12.5px,3.4vw,14.5px)/1.85 var(--mono);
  color:var(--rose-soft);white-space:pre-wrap;opacity:0;transition:opacity .6s}
.out .ol{display:block}
.out b{color:var(--rose);font-weight:500}
.panel.after .out{opacity:1}

.ask{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.ask.on{opacity:1;transform:none;pointer-events:auto}
.ask.gone{opacity:0;transform:translateY(-10px);pointer-events:none}
.q{margin:0;font-size:13px;color:var(--dim);letter-spacing:.04em}
.q:empty{display:none}
.btns{display:flex;gap:18px;align-items:center}
.slot{display:inline-block;transition:width .5s cubic-bezier(.2,.8,.2,1),margin .5s cubic-bezier(.2,.8,.2,1)}
.slot.empty{width:0 !important;margin-left:-18px}
.btn{font:500 16px/1 var(--mono);letter-spacing:.06em;min-width:120px;height:52px;padding:0 30px;
  border-radius:999px;cursor:pointer;border:1px solid transparent;outline:none}
.btn:focus-visible{box-shadow:0 0 0 2px var(--rose)}
.yes{background:var(--ink);color:#0b0b0d;transform:scale(var(--s,1));
  box-shadow:0 0 0 1px rgba(255,255,255,.2),0 0 34px rgba(255,255,255,.22);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.yes:hover{box-shadow:0 0 0 1px rgba(255,255,255,.45),0 0 48px rgba(255,111,152,.6)}
.yes:active{transform:scale(calc(var(--s,1) * .96))}
.no{background:rgba(0,0,0,.4);color:var(--ink);border-color:rgba(244,241,236,.38)}
.no.flee{position:fixed;left:0;top:0;margin:0;z-index:60;
  transition:transform .16s cubic-bezier(.2,.9,.25,1)}
.no.gone{opacity:0;pointer-events:none;transition:opacity .5s}
.hint{margin:0;min-height:1.5em;font-size:11px;color:var(--faint);letter-spacing:.03em}

.replay{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font:500 12px var(--mono);
  letter-spacing:.14em;color:var(--dim);background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:999px;
  padding:10px 20px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .9s,color .3s,border-color .3s}
.replay.on{opacity:1;pointer-events:auto}
.replay:hover{color:var(--ink);border-color:var(--faint)}

@media (max-height:560px){
  .top{padding-top:10px}
  .title{font-size:clamp(32px,11vh,58px)}
  #final{font-size:clamp(28px,9vh,50px)}
  .panel{height:160px}
  .btn{height:44px;min-width:100px}
}
@media (prefers-reduced-motion:reduce){
  .no.flee{transition-duration:0s}
}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<canvas id="bloom" aria-hidden="true"></canvas>
<div class="vignette"></div>

<main class="stage">
  <header class="top" id="top">
    <div class="titles">
      <h1 class="title" id="title"></h1>
      <h2 class="title" id="final" aria-hidden="true"></h2>
    </div>
    <p class="date" id="date"></p>
  </header>

  <div class="ring-area" id="ringArea">
    <div class="frame">
      <div class="hud hud-tr" id="hudTR"><i></i>t <span id="hT">00.00</span>s</div>
      <div class="hud hud-bl" id="hudBL">
        <div>for you &middot; <span id="hYr"></span></div>
        <div>rotation <span id="hRot">000.00</span>&deg;</div>
        <div>glints <span id="hGl">0</span></div>
        <div>letters <span id="hLt">0</span></div>
      </div>
    </div>
  </div>

  <section class="dock">
    <div class="bar"><span id="cmd">$ python ring.py</span><span>running &middot; <span id="hFps">60</span> fps</span></div>
    <div class="panel" id="panel">
      <pre class="code" id="code" aria-hidden="true"></pre>
      <div class="out" id="out" aria-live="polite"></div>
      <div class="ask" id="ask">
        <p class="q" id="q"></p>
        <div class="btns">
          <button class="btn yes" id="yes" type="button">Yes</button>
          <span class="slot" id="slot"><button class="btn no" id="no" type="button">No</button></span>
        </div>
        <p class="hint" id="hint"></p>
      </div>
      <button class="replay" id="replay" type="button">&#8634; replay</button>
    </div>
  </section>
</main>

<script>
(() => {
'use strict';

/* ================= personalise here ================= */
const CONFIG = {
  title: 'I Love You',
  question: '// will you be mine?',
  messages: [
    'you said yes ♥',
    'every letter on this screen was placed here for you.',
    'the ring is just code. what I feel for you is not.',
    "here's to today — and to every day after.",
  ],
  finalTitle: 'Forever & Always',
  hints: [
    '// nice try',
    '// the No button is shy',
    "// it really doesn't want to be pressed",
    '// you already know the answer',
    '// just press yes ♥',
  ],
  sound: true,
};
/* ==================================================== */

const $ = id => document.getElementById(id);
const scene = $('scene'), bloom = $('bloom');
const ctx = scene.getContext('2d');
const bctx = bloom.getContext('2d');
const topEl = $('top'), titleEl = $('title'), finalEl = $('final'), dateEl = $('date');
const ringArea = $('ringArea'), hudTR = $('hudTR'), hudBL = $('hudBL');
const hT = $('hT'), hRot = $('hRot'), hGl = $('hGl'), hLt = $('hLt'), hFps = $('hFps'), cmdEl = $('cmd');
const panel = $('panel'), codeEl = $('code'), outEl = $('out');
const ask = $('ask'), qEl = $('q'), yes = $('yes'), no = $('no'), slot = $('slot'), hint = $('hint'), replay = $('replay');

/* ---------- text setup ---------- */
[...CONFIG.title].forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch === ' ' ? ' ' : ch;
  s.style.setProperty('--i', i);
  titleEl.appendChild(s);
});
titleEl.setAttribute('aria-label', CONFIG.title);
finalEl.textContent = CONFIG.finalTitle;
qEl.textContent = CONFIG.question;
const today = new Date();
dateEl.textContent = [String(today.getDate()).padStart(2, '0'), String(today.getMonth() + 1).padStart(2, '0'), today.getFullYear()].join(' · ');
$('hYr').textContent = today.getFullYear();

/* ---------- live updates for the sender's terminal (only when served by propose.py) ---------- */
const VISITOR = (() => {
  const make = () => Math.random().toString(36).slice(2, 10);
  try { let v = sessionStorage.getItem('pv'); if (!v) { v = make(); sessionStorage.setItem('pv', v); } return v; }
  catch (e) { return make(); }
})();
function report(type, extra) {
  if (!/^https?:$/.test(location.protocol)) return;
  const body = JSON.stringify(Object.assign({ type, v: VISITOR }, extra || {}));
  try { if (navigator.sendBeacon && navigator.sendBeacon('api/event', new Blob([body], { type: 'application/json' }))) return; } catch (e) {}
  try { fetch('api/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true }).catch(() => {}); } catch (e) {}
}
let lastNoReport = 0;
report('open');

/* ---------- helpers ---------- */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const MC = 0.31;          // vertical centre of the ring model
const CAM = 5.4;          // camera distance
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const wrapPi = a => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const nrm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
let sd = 1402;
const rnd = () => { sd = (sd + 0x6D2B79F5) | 0; let t = Math.imul(sd ^ (sd >>> 15), 1 | sd); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

/* intro timeline (seconds) */
const TL = { band0: .35, band: 2.2, arch0: 2.3, arch: .6, gal0: 2.4, prong0: 2.6, prong: .7, gem0: 3.1, gem: 1.3,
  halo0: 3.9, halo: .7, pave0: 4.3, pave: .8, orbit0: 4.8, spin0: 4.9, title0: 4.8, ask0: 6.4 };

/* ================= geometry ================= */
/* Every surface is a cloud of points with a normal. Metal is shaded from a studio
   environment; every diamond facet is its own plane that flashes on its own. */
const G = { x: [], y: [], z: [], nx: [], ny: [], nz: [], ap: [], kind: [], fc: [], vf: [], ao: [] };
function push(x, y, z, nx, ny, nz, ap, kind, fc, vf, ao) {
  const l = Math.hypot(nx, ny, nz) || 1;
  G.x.push(x); G.y.push(y); G.z.push(z);
  G.nx.push(nx / l); G.ny.push(ny / l); G.nz.push(nz / l);
  G.ap.push(ap); G.kind.push(kind); G.fc.push(fc); G.vf.push(vf); G.ao.push(ao);
}
const F = { nx: [], ny: [], nz: [], jx: [], jy: [], jz: [], h: [], kb: [], kr: [], ki: [] };
function newFacet(n, o) {
  const l = Math.hypot(n[0], n[1], n[2]) || 1;
  F.nx.push(n[0] / l); F.ny.push(n[1] / l); F.nz.push(n[2] / l);
  const u = rnd() * 2 - 1, ph = rnd() * TAU, q = Math.sqrt(1 - u * u), m = .9 + rnd() * .8;
  F.jx.push(q * Math.cos(ph) * m); F.jy.push(u * m); F.jz.push(q * Math.sin(ph) * m);
  F.h.push(rnd()); F.kb.push(o.kb); F.kr.push(o.kr); F.ki.push(o.ki);
  return F.nx.length - 1;
}
/* a flat polygon facet (Newell normal, oriented away from `ctr`), filled with points */
function facetPoly(V, ctr, o) {
  let nx = 0, ny = 0, nz = 0, mx = 0, my = 0, mz = 0;
  for (let i = 0; i < V.length; i++) {
    const a = V[i], b = V[(i + 1) % V.length];
    nx += (a[1] - b[1]) * (a[2] + b[2]); ny += (a[2] - b[2]) * (a[0] + b[0]); nz += (a[0] - b[0]) * (a[1] + b[1]);
    mx += a[0]; my += a[1]; mz += a[2];
  }
  mx = mx / V.length - ctr[0]; my = my / V.length - ctr[1]; mz = mz / V.length - ctr[2];
  if (nx * mx + ny * my + nz * mz < 0) { nx = -nx; ny = -ny; nz = -nz; }
  const fid = newFacet([nx, ny, nz], o);
  for (let i = 1; i < V.length - 1; i++) {
    const A = V[0], B = V[i], C = V[i + 1];
    const ux = B[0] - A[0], uy = B[1] - A[1], uz = B[2] - A[2], vx = C[0] - A[0], vy = C[1] - A[1], vz = C[2] - A[2];
    const area = Math.hypot(uy * vz - uz * vy, uz * vx - ux * vz, ux * vy - uy * vx) / 2;
    const n = Math.max(2, Math.round(area * o.dens));
    for (let k = 0; k < n; k++) {
      let a = rnd(), b = rnd();
      if (a + b > 1) { a = 1 - a; b = 1 - b; }
      const x = A[0] + ux * a + vx * b, y = A[1] + uy * a + vy * b, z = A[2] + uz * a + vz * b;
      push(x, y, z, F.nx[fid], F.ny[fid], F.nz[fid], o.ap(x, y, z), 2, fid, o.vf ? o.vf(x, y, z) : fid, 1);
    }
  }
  return fid;
}
/* sweep a rounded (super-elliptic) profile along a curve: prongs, arches, rails, halo frame */
function sweep(curve, steps, around, A, B, k, ref, ap, ao) {
  const e = 2 / k;
  for (let i = 0; i < steps; i++) {
    const t = (i + rnd()) / steps;
    const p = curve(t), p1 = curve(Math.max(0, t - 1e-3)), p2 = curve(Math.min(1, t + 1e-3));
    const T = nrm([p2[0] - p1[0], p2[1] - p1[1], p2[2] - p1[2]]);
    const n1 = nrm(cross(ref(t, p), T)), n2 = cross(T, n1);
    const a = typeof A === 'function' ? A(t) : A, b = typeof B === 'function' ? B(t) : B;
    for (let j = 0; j < around; j++) {
      const v = (j + rnd()) / around * TAU, cv = Math.cos(v), sv = Math.sin(v);
      const pc = Math.sign(cv) * Math.pow(Math.abs(cv), e), qs = Math.sign(sv) * Math.pow(Math.abs(sv), e);
      const np = Math.sign(cv) * Math.pow(Math.abs(cv), e * (k - 1)) / a, nq = Math.sign(sv) * Math.pow(Math.abs(sv), e * (k - 1)) / b;
      push(p[0] + n1[0] * a * pc + n2[0] * b * qs, p[1] + n1[1] * a * pc + n2[1] * b * qs, p[2] + n1[2] * a * pc + n2[2] * b * qs,
        n1[0] * np + n2[0] * nq, n1[1] * np + n2[1] * nq, n1[2] * np + n2[2] * nq, ap(t), 0, 0, 0, ao(t));
    }
  }
}
function bead(cx, cy, cz, r, n, ap, ao) {
  for (let j = 0; j < n; j++) {
    const u = rnd() * 2 - 1, ph = rnd() * TAU, q = Math.sqrt(1 - u * u);
    const nx = q * Math.cos(ph), ny = u, nz = q * Math.sin(ph);
    push(cx + r * nx, cy + r * ny, cz + r * nz, nx, ny, nz, ap + rnd() * .05, 0, 0, 0, ao);
  }
}
/* small accent diamond (halo + pavé): table, 8 crown facets, girdle, pavilion */
function smallStone(c, ax, rs, ap0, dens) {
  const e1 = nrm(Math.abs(ax[1]) < .9 ? cross(ax, [0, 1, 0]) : cross(ax, [1, 0, 0])), e2 = cross(ax, e1);
  const W = (lx, ly, lz) => [c[0] + e1[0] * lx + ax[0] * ly + e2[0] * lz, c[1] + e1[1] * lx + ax[1] * ly + e2[1] * lz, c[2] + e1[2] * lx + ax[2] * ly + e2[2] * lz];
  const rt = .56 * rs, gh = .04 * rs, yt = gh + (rs - rt) * Math.tan(34 * DEG), yc = -gh - rs * .86, rot = rnd() * TAU;
  const T = [], GT = [], GB = [];
  for (let j = 0; j < 8; j++) {
    const a = rot + j * TAU / 8, ca = Math.cos(a), sa = Math.sin(a);
    T.push(W(rt * ca, yt, rt * sa)); GT.push(W(rs * ca, gh, rs * sa)); GB.push(W(rs * ca, -gh, rs * sa));
  }
  const C = W(0, yc, 0), ctr = W(0, 0, 0);
  const ap = () => ap0 + rnd() * .12;
  const o = { dens, ap, kb: .14, kr: .5, ki: .9 };
  const crown = [];
  for (let j = 0; j < 8; j++) crown.push(facetPoly([T[j], T[(j + 1) % 8], GT[(j + 1) % 8], GT[j]], ctr, o));
  const vf = (x, y, z) => {
    const dx = x - c[0], dy = y - c[1], dz = z - c[2];
    let a = Math.atan2(dx * e2[0] + dy * e2[1] + dz * e2[2], dx * e1[0] + dy * e1[1] + dz * e1[2]) - rot + Math.PI;
    a = ((a % TAU) + TAU) % TAU;
    return crown[Math.floor(a / (TAU / 8)) % 8];
  };
  facetPoly(T, ctr, { ...o, vf });
  for (let j = 0; j < 8; j++) facetPoly([GT[j], GT[(j + 1) % 8], GB[(j + 1) % 8], GB[j]], ctr, { ...o, dens: dens * .5, kb: .1, ki: .4 });
  for (let j = 0; j < 8; j++) facetPoly([GB[j], GB[(j + 1) % 8], C], ctr, { ...o, dens: dens * .3, kb: .05, kr: .4, ki: .5 });
}

/* ---- 1. the shank: tapered, comfort-fit platinum band ---- */
const R0 = 1.0, SEn = 3.0, PAVE_G0 = 16 * DEG, PAVE_G1 = 72 * DEG;
const hwAt = g => .118 - .043 * (1 - smooth(.14 * Math.PI, .72 * Math.PI, g));   // half width (z)
const thAt = g => .086 - .012 * (1 - smooth(.14 * Math.PI, .6 * Math.PI, g));    // half thickness (radial)
{
  const NU = 820, NV = 40, e = 2 / SEn;
  for (let i = 0; i < NU; i++) for (let j = 0; j < NV; j++) {

  /* motion */
  let w = .5 * smooth(TL.spin0, TL.spin0 + 1.8, t);
  if (tY >= 0) w += 7 * Math.exp(-tY * 1.5) * smooth(0, .2, tY);
  theta += w * dt;
  const tilt = .15 + .05 * Math.sin(t * .5);
  const ct = Math.cos(theta), st = Math.sin(theta), cx = Math.cos(tilt), sx = Math.sin(tilt);
  const fl = tY < 0 ? 1 : 1 + .9 * Math.exp(-Math.pow((tY - .15) / .18, 2));
  let sc = 1;
  if (hm > 0) {
    const p = (t % 1.1) / 1.1;
    sc = 1 + hm * .075 * (Math.exp(-Math.pow((p - .08) / .05, 2)) + .6 * Math.exp(-Math.pow((p - .28) / .06, 2)));
  }

  /* environment: static studio + a rim light that circles */
  {
    const ra = t * .9;
    let r0 = Math.cos(ra), r1 = .35, r2 = Math.sin(ra);
    const l = Math.hypot(r0, r1, r2); r0 /= l; r1 /= l; r2 /= l;
    for (let i = 0; i < ENN; i++) {
      const d = EDX[i] * r0 + EDY[i] * r1 + EDZ[i] * r2;
      ENVB[i] = d > .95 ? ESTAT[i] + smooth(.95, .985, d) * 1.1 : ESTAT[i];
    }
  }
  /* every facet: what it mirrors, and what bounces back out from inside the stone */
  for (let f = 0; f < NF; f++) {
    const fx = FNX[f], fy = FNY[f], fz = FNZ[f];
    const x1 = fx * ct + fz * st, z1 = fz * ct - fx * st;
    const y2 = fy * cx - z1 * sx, nz = fy * sx + z1 * cx;
    const rx = 2 * nz * x1, ry = 2 * nz * y2, rz = 2 * nz * nz - 1;
    FREF[f] = nz > 0 ? ENVB[octIdx(rx, ry, rz)] : 0;
    const jx = FJX[f], jy = FJY[f], jz = FJZ[f];
    const jx1 = jx * ct + jz * st, jz1 = jz * ct - jx * st;
    const jy2 = jy * cx - jz1 * sx, jz2 = jy * sx + jz1 * cx;
    const e = ENVB[octIdx(rx + jx1, ry + jy2, rz + jz2)];
    FINT[f] = Math.min(1.6, .18 + 1.1 * e * e);
  }

  const morph = tY > .5;
  let nt = renderPoints(t, tY, fn, ct, st, cx, sx, sc, fl, morph);
  nt = renderOrbits(t, fn, cx, sx, hm, nt);
  const glintCells = blitLetters(nt);

  /* ---- drifting dust ---- */
  const df = smooth(0, 1.2, t);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.font = '8px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
  ctx.textBaseline = 'top';
  ctx.fillStyle = hm > .5 ? '#ffb3c8' : '#c8ccd6';
  for (let i = 0; i < dust.length; i++) {
    const d = dust[i], s = Math.sin(t * d.sp + d.ph);
    ctx.globalAlpha = (.03 + .2 * (s > 0 ? s * s * s : 0)) * df;
    ctx.fillText(d.ch, d.x, d.y);
  }
  ctx.globalAlpha = 1;

  /* ---- glints (star flares on the facets that are flashing) ---- */
  if (t > TL.gem0 + TL.gem * .6) {
    ctx.globalCompositeOperation = 'lighter';
    const gs = S / 140, rose = hm > .5, gn = rose ? 3 : 6;
    for (let g = 0; g < gn; g++) {
      const gl = glints[g];
      const age = (t - gl.t0) / gl.life;
      if (age >= 1 || gl.t0 < 0) { pickGlint(gl, t, rose); continue; }
      if (age < 0 || SVIS[gl.i] !== fn) continue;
      const I = Math.pow(Math.sin(Math.PI * age), 2), px = SPX[gl.i], py = SPY[gl.i];
      const L = (22 + 60 * I) * gs * gl.sz, colr = rose ? '255,190,210' : '255,255,255';
      ctx.lineWidth = gl.sz > .6 ? 1.2 : .9;
      for (const [dx, dy] of [[0, -1.6], [0, 1.05], [1, 0], [-1, 0], [.38, .38], [-.38, -.38], [.38, -.38], [-.38, .38]]) {
        const gr = ctx.createLinearGradient(px, py, px + dx * L, py + dy * L);
        gr.addColorStop(0, `rgba(${colr},${.85 * I})`); gr.addColorStop(1, `rgba(${colr},0)`);
        ctx.strokeStyle = gr;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + dx * L, py + dy * L); ctx.stroke();
      }
      const rr = (3 + 8 * I) * gs * gl.sz;
      const rg = ctx.createRadialGradient(px, py, 0, px, py, rr);
      rg.addColorStop(0, `rgba(${colr},${.9 * I})`); rg.addColorStop(1, `rgba(${colr},0)`);
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(px, py, rr, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- fireworks ---- */
  if (sparks.length) {
    ctx.font = `${Math.max(9, FS * 1.6)}px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace`;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.age += dt;
      if (p.age >= p.life) { sparks.splice(i, 1); continue; }
      const drag = 1 - 1.6 * dt;
      p.vx *= drag; p.vy = p.vy * drag + 140 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = Math.pow(1 - p.age / p.life, 1.5);
      ctx.fillStyle = p.c;
      ctx.fillText(p.ch, p.x, p.y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'start';
  }

  /* ---- bloom ---- */
  bctx.clearRect(0, 0, bloom.width, bloom.height);
  if (scene.width && scene.height && bloom.width && bloom.height) bctx.drawImage(scene, 0, 0, bloom.width, bloom.height);

  /* ---- hud ---- */
  hudAcc += dt;
  if (hudAcc > .1) {
    hudAcc = 0;
    hT.textContent = t.toFixed(2).padStart(5, '0');
    hRot.textContent = (((theta * 180 / Math.PI) % 360 + 360) % 360).toFixed(2).padStart(6, '0');
    hGl.textContent = glintCells.toLocaleString('en-US');
    hLt.textContent = nt.toLocaleString('en-US');
    hFps.textContent = Math.round(fps);
  }
}

/* ---------- start once fonts are in ---------- */
const ready = document.fonts && document.fonts.ready
  ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))])
  : Promise.resolve();
ready.then(() => {
  resize();
  addEventListener('resize', resize);
  requestAnimationFrame(frame);
});
})();
</script>
</body>
</html>
